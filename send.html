<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>写真を送信</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        input { margin: 20px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>写真を送る</h2>
    <input type="file" id="fileInput" accept="image/*"><br>
    <button onclick="upload()">送信する</button>
    <p id="status"></p>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxqTMadGYXKioUbdJ3hFcFCnLqOSOt3OrvVCHi_zFBIeaCk0DKqZfZRrc1j3VzsapdEIw/exec";

        function upload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("写真を選んでね");

            const status = document.getElementById('status');
            status.innerText = "送信中...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result.split(',')[1];
                fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ img: base64, name: file.name })
                })
                .then(() => {
                    status.innerText = "送信完了！相手の画面に届いたはずです。";
                    document.getElementById('fileInput').value = "";
                })
                .catch(() => status.innerText = "エラーが起きました");
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
