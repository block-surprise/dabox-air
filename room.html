<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; position: sticky; top: 0; }
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-box { background: white; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg-box img { max-width: 100%; border-radius: 5px; display: block; margin-bottom: 5px; }
        .msg-box span { font-size: 0.7em; color: #888; }
        footer { background: #f0f0f0; padding: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="file"] { display: none; }
        .upload-btn { background: #128c7e; color: white; padding: 10px; border-radius: 50px; cursor: pointer; font-size: 0.8em; }
    </style>
</head>
<body>
    <header><h2 id="roomTitle">読み込み中...</h2></header>
    <div id="chat-area"></div>
    <footer>
        <label class="upload-btn">📷 写真を選択
            <input type="file" id="fileInput" accept="image/*" onchange="upload()">
        </label>
        <span id="status"></span>
    </footer>

<script>
    // 1. あなたのGASのURLに書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwUZyVq0dkWzYUCXVoh56CeUwb14q9BXcq-DHJw1QYv3b-Jy9HvgdJCpMVLrvDGeDsqGA/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomID = urlParams.get('id');
    document.getElementById('roomTitle').innerText = `部屋: ${roomID}`;

    // 入室時にパスワードを聞く
    let password = prompt("この部屋のパスワードを入力してください\n(初めて作る部屋なら、これがその部屋のパスワードになります)");

    // 写真を送る
    function upload() {
        const file = document.getElementById('fileInput').files[0];
        if(!file) return;
        document.getElementById('status').innerText = "送信中...";
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result.split(',')[1];
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    img: base64, 
                    name: file.name, 
                    roomID: roomID, 
                    password: password 
                })
            }).then(res => res.text()).then(txt => {
                if(txt === "パスワードが違います") alert(txt);
                document.getElementById('status').innerText = "";
                refresh();
            });
        };
        reader.readAsDataURL(file);
    }

    // チャットを更新する
    function refresh() {
        if(!roomID || !password) return;
        fetch(`${GAS_URL}?room=${encodeURIComponent(roomID)}&pass=${encodeURIComponent(password)}`)
            .then(res => res.json())
            .then(data => {
                if(data.error) {
                    alert("パスワードが違います。ページを更新してやり直してください。");
                    return;
                }
                const area = document.getElementById('chat-area');
                // 逆順（新しいのが下）にする場合は data.reverse() を使う
                area.innerHTML = data.map(m => `
                    <div class="msg-box">
                        <img src="${m.url}">
                        <span>${m.time}</span>
                    </div>
                `).join("");
            });
    }

    // 5秒おきに自動更新
    refresh();
    setInterval(refresh, 5000);
</script>
</body>
</html>
