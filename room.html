<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Chat Room</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 10; }
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* メッセージの見た目 */
        .msg-box { background: white; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 85%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-box img { max-width: 100%; border-radius: 5px; display: block; margin-bottom: 5px; cursor: pointer; }
        .msg-box span { font-size: 0.75em; color: #888; display: block; text-align: right; }
        
        footer { background: #f0f0f0; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        .controls { display: flex; align-items: center; gap: 15px; width: 100%; justify-content: center; }
        
        input[type="file"] { display: none; }
        .upload-btn { background: #128c7e; color: white; padding: 12px 24px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .upload-btn:hover { background: #075e54; }
        #status { font-size: 0.9em; color: #666; font-weight: bold; }
    </style>
</head>
<body>
    <header><h2 id="roomTitle">読み込み中...</h2></header>
    
    <div id="chat-area">
        <p style="text-align:center; color:#888;">読み込み中...</p>
    </div>

    <footer>
        <div id="status"></div>
        <div class="controls">
            <label class="upload-btn">📷 写真を送る
                <input type="file" id="fileInput" accept="image/*" onchange="upload()">
            </label>
        </div>
    </footer>

<script>
    // ★ ここにあなたの最新のGASウェブアプリURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwUZyVq0dkWzYUCXVoh56CeUwb14q9BXcq-DHJw1QYv3b-Jy9HvgdJCpMVLrvDGeDsqGA/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomID = urlParams.get('id');
    
    if(!roomID) {
        alert("部屋名がありません。ホームに戻ります。");
        window.location.href = "index.html";
    }

    document.getElementById('roomTitle').innerText = `部屋: ${roomID}`;

    // 入室時にパスワードを取得
    let password = prompt(`「${roomID}」のパスワードを入力してください\n※初めての部屋なら、今決めるパスワードが正解になります`);

    if(!password) {
        window.location.href = "index.html";
    }

    // 写真アップロード関数
    function upload() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if(!file) return;

        const status = document.getElementById('status');
        status.innerText = "🚀 送信中...";
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result.split(',')[1];
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    img: base64, 
                    name: file.name, 
                    roomID: roomID, 
                    password: password 
                })
            })
            .then(res => res.text())
            .then(txt => {
                if(txt === "パスワードが違います") {
                    alert("⚠️ 送信失敗: パスワードが違います");
                } else {
                    status.innerText = "✅ 送信完了！";
                    setTimeout(() => { status.innerText = ""; }, 2000);
                }
                fileInput.value = ""; // リセット
                refresh();
            })
            .catch(err => {
                alert("送信エラーが発生しました");
                status.innerText = "";
            });
        };
        reader.readAsDataURL(file);
    }

    // チャット内容の更新関数
    let lastDataString = "";
    function refresh() {
        fetch(`${GAS_URL}?room=${encodeURIComponent(roomID)}&pass=${encodeURIComponent(password)}`)
            .then(res => res.json())
            .then(data => {
                // パスワードエラー時の強制送還
                if(data.error) {
                    alert("❌ パスワードが違います。ホームに戻ります。");
                    window.location.href = "index.html";
                    return;
                }

                // 新旧データの比較（変化がある時だけ書き換え）
                const currentDataString = JSON.stringify(data);
                if (currentDataString === lastDataString) return;
                lastDataString = currentDataString;

                const area = document.getElementById('chat-area');
                if (data.length === 0) {
                    area.innerHTML = "<p style='text-align:center; color:#888;'>まだ写真がありません。<br>下のボタンから最初の1枚を送ってみよう！</p>";
                } else {
                    area.innerHTML = data.map(m => `
                        <div class="msg-box">
                            <img src="${m.url}" onclick="window.open(this.src)">
                            <span>${m.time}</span>
                        </div>
                    `).join("");
                    // 一番下までスクロール
                    area.scrollTop = area.scrollHeight;
                }
            })
            .catch(err => console.error("受信エラー:", err));
    }

    // 最初に実行＆5秒ごとにチェック
    refresh();
    setInterval(refresh, 5000);
</script>
</body>
</html>
