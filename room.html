<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo & Text Chat</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 10px; text-align: center; font-size: 1.2em; }
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 8px 12px; border-radius: 10px; max-width: 80%; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg img { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; min-height: 50px; background: #eee; }
        .msg .time { font-size: 0.7em; color: #888; text-align: right; margin-top: 4px; }
        footer { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #ccc; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        .btn { background: #128c7e; color: white; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-size: 1.2em; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <header id="roomTitle">Chat Room</header>
    <div id="chat-area"></div>
    <footer>
        <label style="cursor:pointer; font-size:1.5em;">📷<input type="file" id="fileInput" accept="image/*" onchange="send('img')"></label>
        <input type="text" id="textInput" placeholder="メッセージを入力...">
        <button class="btn" onclick="send('text')">➤</button>
    </footer>

<script>
    const GAS_URL = "あなたのGASのURL";
    const urlParams = new URLSearchParams(window.location.search);
    const roomID = urlParams.get('id');
    let password = prompt("パスワードを入力");

    async function send(type) {
        const textInput = document.getElementById('textInput');
        const fileInput = document.getElementById('fileInput');
        let payload = { roomID, password, text: textInput.value };

        if (type === 'img' && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                payload.img = e.target.result.split(',')[1];
                payload.name = fileInput.files[0].name;
                await post(payload);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else if (textInput.value) {
            await post(payload);
            textInput.value = "";
        }
    }

    async function post(payload) {
        document.getElementById('roomTitle').innerText = "送信中...";
        await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        document.getElementById('roomTitle').innerText = "部屋: " + roomID;
        refresh();
    }

    let lastHash = "";
    async function refresh() {
        try {
            const res = await fetch(`${GAS_URL}?room=${roomID}&pass=${password}`);
            const data = await res.json();
            if (data.error) { alert("パス間違い"); window.location.href="index.html"; }
            
            if (JSON.stringify(data) === lastHash) return;
            lastHash = JSON.stringify(data);

            const area = document.getElementById('chat-area');
            area.innerHTML = data.map(m => `
                <div class="msg">
                    ${m.text ? `<div>${m.text}</div>` : ""}
                    ${m.url ? `<img src="${m.url}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Loading...'">` : ""}
                    <div class="time">${m.time}</div>
                </div>
            `).join("");
            area.scrollTop = area.scrollHeight;
        } catch(e) {}
    }

    setInterval(refresh, 3000);
    refresh();
</script>
</body>
</html>
