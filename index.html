<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Box Home</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 30px; }
        .menu-button {
            display: block;
            width: 200px;
            margin: 15px auto;
            padding: 15px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }
        .send-btn { background-color: #007bff; }
        .receive-btn { background-color: #28a745; }
        .menu-button:hover { transform: translateY(-3px); opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 Photo Box</h1>
    <p>どちらに進みますか？</p>
    
    <a href="send.html" class="menu-button send-btn">写真を送る</a>
    <a href="receive.html" class="menu-button receive-btn">写真を見る</a>
</div>

</body>
</html>
