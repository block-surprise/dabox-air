<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Chat Home</title>
    
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f7f6; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Photo Chat</h2>
        <p>部屋名を入力して入室</p>
        <input type="text" id="roomName" placeholder="部屋の名前（例: travel）">
        <button onclick="enterRoom()">入室する</button>
    </div>

    <script>
        function enterRoom() {
            const name = document.getElementById('roomName').value;
            if(!name) return alert("部屋名を入れてね");
            // room.htmlに部屋名をくっつけて移動する
            window.location.href = `room.html?id=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
